plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}
 group ='com.example'
 version = '1.0-SNAPSHOT'
 repositories {
    mavenCentral()
}
java {
    toolchain {
        LanguageVersion = JavaLanguageVersion.of(21)
    }
}
javafx {
    version = '21'
    modules = ['javafx.controls']
}
application {
    mainModule= 'com.example.hellofx'
    mainClass= 'com.example.hellofx.Main'

}